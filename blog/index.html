    :root { --bg: #0f1115; --card: #181c24; --text: #e4e7eb; --muted: #8b919e; --accent: #3dd68c; --border: #252b35; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; line-height: 1.8; }

    .date { color: var(--accent); font-size: 14px; font-weight: 600; }
    article { margin-top: 44px; }
    article p { color: #c5c9d0; font-size: 17px; }
    article h2 { font-size: 24px; margin: 36px 0 12px; }
    .post-link { display: block; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 26px; transition: 0.2s ease; }
    .post-link:hover { background: #1e232c; border-color: var(--muted); transform: translateY(-3px); }
    .post-link h2 { margin: 8px 0; font-size: 22px; }
    .post-link p { margin: 0; color: var(--muted); font-size: 15px; }
    footer { margin-top: 64px; padding-top: 24px; border-top: 1px solid var(--border); color: var(--muted); font-size: 13px; }
  </style>
</head>
