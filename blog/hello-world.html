<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>开始写博客 · Roosong</title>
  <meta name="description" content="记录想法、学习和生活。">
  <style>
    :root { --bg: #0f1115; --card: #181c24; --text: #e4e7eb; --muted: #8b919e; --accent: #3dd68c; --border: #252b35; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; line-height: 1.8; }
    a { color: inherit; text-decoration: none; }
    .wrap { width: min(760px, calc(100% - 40px)); margin: 0 auto; padding: 48px 0 80px; }
    .back { color: var(--muted); font-size: 14px; }
    .back:hover { color: var(--accent); }
    h1 { font-size: clamp(34px, 7vw, 56px); line-height: 1.1; letter-spacing: -0.03em; margin: 48px 0 12px; }
    .date { color: var(--accent); font-size: 14px; font-weight: 600; }
    article { margin-top: 44px; }
    article p { color: #c5c9d0; font-size: 17px; }
    article h2 { font-size: 24px; margin: 36px 0 12px; }
    .post-link { display: block; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 26px; transition: 0.2s ease; }
    .post-link:hover { background: #1e232c; border-color: var(--muted); transform: translateY(-3px); }
    .post-link h2 { margin: 8px 0; font-size: 22px; }
    .post-link p { margin: 0; color: var(--muted); font-size: 15px; }
    footer { margin-top: 64px; padding-top: 24px; border-top: 1px solid var(--border); color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
  <main class="wrap">
    <a class="back" href="/blog/">← 返回文章列表</a>
    <h1>开始写博客</h1>
    <div class="date">2026.09.09</div>
    <article>
      <p>这是这个博客的第一篇文章。</p>
      <p>以前总觉得要准备好一个很大的理由，才值得开始记录。后来发现，真正有用的记录往往很小：今天学到的一件事、一个突然想通的问题、一段值得记住的经历，或者只是某一天的心情。</p>
      <h2>为什么写博客</h2>
      <p>写作不是为了让别人觉得自己懂得多，而是帮助自己把模糊的想法整理清楚。一个念头在脑子里可能只是一团雾，写下来以后，才会慢慢变成一条路。</p>
      <p>这个网站会持续更新。内容可能关于技术、学习、阅读和生活，也可能只是一些暂时没有答案的问题。欢迎偶尔回来看看。</p>
    </article>
    <footer>© 2026 Roosong · GitHub Pages</footer>
  </main>
</body>
</html>
